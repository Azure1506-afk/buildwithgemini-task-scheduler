<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Scheduler AI</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-light: #e0e7ff;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    --bg: #f8fafc;
    --border: #e2e8f0;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --user-bubble: #4f46e5;
    --agent-bubble: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-brand .material-symbols-outlined {
    font-size: 2rem;
    background: rgba(255,255,255,0.2);
    padding: 0.4rem;
    border-radius: 10px;
    color: #ffffff;
  }
  .header-title {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .header-subtitle {
    font-size: 0.8rem;
    opacity: 0.85;
    font-weight: 400;
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.15);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }

  /* Log & Messages */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.25s ease-out forwards;
  }
  .msg-row.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .avatar.agent {
    background: var(--accent-light);
    color: var(--accent);
  }
  .avatar.user {
    background: #cbd5e1;
    color: #334155;
  }

  .bubble-wrap {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg-row.user .bubble-wrap {
    align-items: flex-end;
  }

  .sender-name {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
    margin-left: 0.25rem;
  }

  .bubble {
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.95rem;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg-row.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    white-space: normal;
    width: 100%;
  }

  /* Bottom Controls & Prompts */
  .footer-container {
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* Example Prompts Chips */
  .prompt-chips {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
    scroll-behavior: smooth;
  }
  .chip-button {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .chip-button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
  }
  .chip-button .chip-icon {
    font-size: 1.1rem;
    color: var(--accent);
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.6rem;
    background: #ffffff;
    padding: 0.6rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    outline: none;
    font-size: 0.95rem;
    font-family: inherit;
    background: transparent;
    color: var(--text-primary);
  }
  input::placeholder {
    color: #94a3b8;
  }
  button.send-btn {
    padding: 0.75rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }
  button.send-btn:active {
    transform: translateY(0);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.1rem; background:#ffffff; box-shadow:var(--shadow-md); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size:1.4rem; font-weight:700; color: var(--accent); }
  .a2text.a2-h2 { font-size:1.2rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.05rem; font-weight:600; }
  .a2text.a2-h4 { font-size:0.95rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color: var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; margin-top: 0.5rem; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span class="material-symbols-outlined">task_alt</span>
    <div>
      <div class="header-title">Task Scheduler AI</div>
      <div class="header-subtitle">Smart task, backlog & workload manager</div>
    </div>
  </div>
  <div class="header-status">
    <span class="status-dot"></span>
    Agent Active
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <div class="prompt-chips">
    <button class="chip-button" onclick="usePrompt('Search for my high priority tasks')">
      <span class="material-symbols-outlined chip-icon">priority_high</span>
      High Priority Tasks
    </button>
    <button class="chip-button" onclick="usePrompt('Show upcoming public holidays and calculate workload')">
      <span class="material-symbols-outlined chip-icon">event</span>
      Holidays & Workload
    </button>
    <button class="chip-button" onclick="usePrompt('Generate a completion badge for task-101')">
      <span class="material-symbols-outlined chip-icon">military_tech</span>
      Generate Task Badge
    </button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask Task Scheduler anything..." autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar " + who);
  const icon = el("span", "material-symbols-outlined");
  icon.textContent = who === "user" ? "person" : "smart_toy";
  avatar.appendChild(icon);

  const wrap = el("div", "bubble-wrap");
  const sender = el("div", "sender-name", who === "user" ? "You" : "Task Scheduler AI");
  const b = el("div", "bubble");

  wrap.appendChild(sender);
  wrap.appendChild(b);

  row.appendChild(avatar);
  row.appendChild(wrap);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function usePrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
